name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tctravel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
      - name: Set up exact quality Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.12.3"
      - name: Install hash-locked quality tools
        run: python -m pip install --require-hashes --no-deps -r requirements-ci.txt
      - name: Strict type-check
        env:
          PYRIGHT_PYTHON_GLOBAL_NODE: "1"
        run: python -m pyright --project pyrightconfig.ci.json
      - name: Check correctness lint rules
        run: python -m ruff check . --select E4,E7,E9,F63,F7,F82 --per-file-ignores "tools/generate_visuals.py:E402"
      - name: Check production formatting
        run: python -m ruff format --check tctravel

  runtime:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the hash-locked build backend
        run: python -m pip install --require-hashes --no-deps -r requirements-build.txt
      - name: Test runtime and standard-library evidence contracts
        run: |
          python -m unittest -v \
            tests.test_cli \
            tests.test_interval_analysis \
            tests.test_itinerary_contract \
            tests.test_legacy_manifest \
            tests.test_packaging \
            tests.test_temporal_compiler \
            tests.test_visual_evidence

  evidence:
    name: Reproducible evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact evidence Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.12.3"
      - name: Install the exact attested evidence toolchain
        run: python -m pip install --require-hashes --no-deps -r requirements-evidence.txt
      - name: Run the complete test suite
        run: python -m unittest discover -s tests -v
      - name: Reproduce installed-wheel analysis evidence
        run: python tools/generate_analysis_evidence.py --check
      - name: Reproduce compiler evidence
        run: python tools/generate_visuals.py --check
      - name: Verify the legacy quarantine
        run: python tools/verify_legacy.py --check
      - name: Reject tracked or untracked drift
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
