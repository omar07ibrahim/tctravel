name: Evidence refresh

on:
  push:
    branches: [security/pillow-12.3-evidence]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    name: Regenerate patched evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up exact evidence Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.12.3"
      - name: Install the patched evidence toolchain
        run: python -m pip install --require-hashes --no-deps -r requirements-evidence.txt
      - name: Regenerate the source-bound evidence bundle
        run: python tools/generate_analysis_evidence.py --write
      - name: Verify the complete repository
        run: |
          python -m unittest discover -s tests -v
          python tools/generate_analysis_evidence.py --check
          python tools/generate_visuals.py --check
          python tools/verify_legacy.py --check
      - name: Restrict generated changes to analysis evidence
        run: |
          python - <<'PY'
          import subprocess

          payload = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "-z", "--untracked-files=all"]
          ).decode("utf-8")
          changed = []
          rejected = []
          for record in payload.split("\0"):
              if not record:
                  continue
              if len(record) < 4:
                  raise SystemExit("malformed git status record")
              path = record[3:]
              changed.append(path)
              if not path.startswith("docs/analysis-evidence/"):
                  rejected.append(path)
          if not changed:
              raise SystemExit("evidence refresh produced no changes")
          if rejected:
              raise SystemExit("unexpected generated paths: " + ", ".join(rejected))
          print("Generated paths:")
          print("\n".join(sorted(changed)))
          PY
      - name: Commit the regenerated artifacts as Omar Ibrahim
        env:
          GIT_AUTHOR_NAME: Omar Ibrahim
          GIT_AUTHOR_EMAIL: 31526072+omar07ibrahim@users.noreply.github.com
          GIT_COMMITTER_NAME: Omar Ibrahim
          GIT_COMMITTER_EMAIL: 31526072+omar07ibrahim@users.noreply.github.com
        run: |
          git add -- docs/analysis-evidence
          git commit -m "Regenerate evidence with patched Pillow"
          git push origin "HEAD:$GITHUB_REF_NAME"
